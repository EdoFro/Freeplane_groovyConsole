//groovyConsole



apply plugin: 'groovy'

targetCompatibility='1.8'

def freeplaneVersion = '1.13.3'
def configuredFreeplaneDir = providers.gradleProperty('freeplaneDir').orNull?.trim()
if (!configuredFreeplaneDir) {
    throw new GradleException('Set freeplaneDir in groovyConsole/gradle.properties (copy gradle.properties.example), or pass -PfreeplaneDir=C:/path/to/freeplane-1.13.3.')
}
// Relative paths are resolved against this Gradle project (groovyConsole).
def freeplaneDir = file(configuredFreeplaneDir)
def freeplaneLibraries = [
    new File(freeplaneDir, 'freeplanelauncher.jar'),
    new File(freeplaneDir, 'core/org.freeplane.core/lib/freeplaneviewer.jar'),
    new File(freeplaneDir, "core/org.freeplane.core/lib/freeplaneeditor-${freeplaneVersion}.jar"),
    new File(freeplaneDir, "plugins/org.freeplane.plugin.script/lib/plugin-${freeplaneVersion}.jar")
]
def missingLibraries = freeplaneLibraries.findAll { !it.isFile() }
if (missingLibraries) {
    throw new GradleException("freeplaneDir must point to an extracted Freeplane ${freeplaneVersion} distribution. Missing libraries:\n" + missingLibraries.join('\n'))
}

def groovyVersion = '4.0.27'

	def isNewerGroovy = groovyVersion.startsWith('4.')
	def groovyGroupId = isNewerGroovy?'org.apache.groovy':'org.codehaus.groovy'


libsDirName = "${rootDir}/lib"
clean.doFirst { delete "${rootDir}/lib" } // para eliminar todas las .jar
//clean.doFirst { delete "${rootDir}/lib/Tutorial-o-Matic.jar" } //para eliminar sólo una de las .jar y que no me borrara markedj ni jsoup

repositories {
    mavenCentral()
}


// I had this error:
    // Could not find method compile() for arguments [{name=freeplanelauncher}] on object of type org.gradle.api.internal.artifacts.dsl.dependencies.DefaultDependencyHandler
// answer:
    // https://stackoverflow.com/questions/69733508/couldnt-find-compile-for-arguments-directory-libs-on-object-of-type-org-g
    

dependencies {
    // Exact files from the chosen 1.13.3 distribution; no dynamic version or remote fallback.
    implementation files(freeplaneLibraries)
    if(isNewerGroovy){
        implementation ("${groovyGroupId}:groovy-all:${groovyVersion}".toString()) {
            exclude group:groovyGroupId, module:'groovy-test'
            exclude group:groovyGroupId, module:'groovy-test-junit5'
            exclude group:groovyGroupId, module:'groovy-testng'
            exclude group:groovyGroupId, module:'groovy-ant'
            exclude group:groovyGroupId, module:'groovy-docgenerator'
            exclude group:groovyGroupId, module:'groovy-groovydoc'
            exclude group:groovyGroupId, module:'groovy-cli-commons'
            exclude group:groovyGroupId, module:'groovy-cli-picocli'
        }
    } else {
        implementation ("${groovyGroupId}:groovy-all:${groovyVersion}".toString()) {
            exclude group:groovyGroupId, module:'groovy-test'
            exclude group:groovyGroupId, module:'groovy-test-junit5'
            exclude group:groovyGroupId, module:'groovy-testng'
            exclude group:groovyGroupId, module:'groovy-ant'
            exclude group:groovyGroupId, module:'groovy-docgenerator'
            exclude group:groovyGroupId, module:'groovy-groovydoc'
            exclude group:groovyGroupId, module:'groovy-cli-commons'
            exclude group:groovyGroupId, module:'groovy-cli-picocli'
        }    
    }
    implementation "${groovyGroupId}:groovy-dateutil:${groovyVersion}".toString()
}

tasks.register('verifyTemporaryScripts', JavaExec) {
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'groovy.ui.GroovyMain'
    args file('src/test/scripts/TemporaryScriptChecks.groovy').absolutePath, layout.buildDirectory.get().asFile.absolutePath
}

tasks.named('check') { dependsOn 'verifyTemporaryScripts' }

tasks.named('processResources') {
    from('zips/icons/groovyConsole/temporaryScript.svg') {
        into 'icons/groovyConsole'
    }
}
